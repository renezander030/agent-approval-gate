name: Validate contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/generate_examples.py
      - run: git diff --exit-code -- examples
      - run: python -m unittest discover -s tests -v

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          envelopes: |
            examples/approval-envelope.json
          records: |
            approval-record examples/webauthn-approval-record.json
            resolution-record examples/resolution-record.json
          audit-events: examples/audit-events.json
          audit-snapshot: examples/audit-snapshot.json
